apis:
- aid: logius:digipoort-wus-2-0-bedrijven
  name: Digipoort WUS 2.0 voor bedrijven
  description: >-
    Digipoort is the Logius electronic post office for exchanging messages between businesses and Dutch
    government bodies (e.g. Belastingdienst, SBR filings). Its WUS 2.0 SOAP interface for businesses offers
    the Aanleverservice (submit), Statusinformatieservice (status), Ophaalservice (retrieve) and Machtigingraadpleegservice
    (authorisation lookup); WSDLs come from the koppelvlak ZIP Logius publishes on logius.nl.
  humanURL: >-
    https://www.logius.nl/onze-dienstverlening/gegevensuitwisseling/digipoort/wat-is-het/koppelvlakken/wus-voor-bedrijven
  baseURL: https://dgp.procesinfrastructuur.nl/wus/2.0
  tags:
  - SOAP
  - Digipoort
  - Data Exchange
