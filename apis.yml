aid: logius

name: Logius

description: Logius is the digital government service organisation of the Dutch Ministry of the Interior and Kingdom Relations (Ministerie van
  Binnenlandse Zaken en Koninkrijksrelaties). It provides the shared ICT infrastructure and standards used by Dutch public service providers,
  including DigiD, eHerkenning, MijnOverheid, Digipoort, Digikoppeling, PKIoverheid and Standard Business Reporting, and it maintains the NL GOV
  REST API Design Rules and related API standards (with a Spectral linter ruleset) for the Dutch public sector.

