  data_retention:
    url: https://www.logius.nl/privacyverklaring
    section: 'Waarvoor verwerkt Logius persoonsgegevens? / Hoe lang bewaart Logius mijn gegevens?'
    evidence:
    - source: https://www.logius.nl/privacyverklaring
      http_status: 200
      fetched: '2026-10-09'
      quote: 'Voor het beantwoorden van uw vragen verwerkt Logius in ieder geval uw naam, telefoonnummer en e-mailadres. Afhankelijk van uw vraag kan ook uw BSN of andere benodigde informatie die noodzakelijk is voor de ondersteuning verwerkt worden. Deze gegevens worden 18 maanden bewaard.'
    - source: https://www.logius.nl/privacyverklaring
      http_status: 200
      fetched: '2026-10-09'
      quote: 'De gegevens worden bewaard voor de duur van het gebruik van Logius-diensten, en daarna maximaal vijf jaar. Wanneer u bij Logius aangeeft geen contactpersoon meer te zijn, verwijderen wij uw gegevens binnen 10 werkdagen.'
    - source: https://www.logius.nl/privacyverklaring
      http_status: 200
      fetched: '2026-10-09'
      quote: 'Na verloop van de bewaartermijn worden uw gegevens vernietigd of geanonimiseerd. In sommige gevallen volgen de bewaartermijnen uit de wet, in andere gevallen stelt Logius die vast.'
    note: >-
      Concrete retention periods for the general statement: support-query data is kept 18 months, and data
      on customer (afnemer) contact persons is kept for the duration of service use plus at most five years,
      or deleted within 10 working days once someone stops being a contact. Product-specific periods
      (DigiD, MijnOverheid) are left to the per-product privacy statements. Archiefwet transfer to the
      Nationaal Archief may apply.
