method: derived
status: candidate
source:
- openapi/logius-fsc-manager-openapi.yml
- openapi/logius-notificatieservices-openapi.yml
- openapi/logius-terugmelding-openapi.yml
description: >-
  Logius does not publish an MCP server. A web search on 2026-10-09 ("Logius MCP server
  Model Context Protocol") returned nothing from Logius, and the preflight probes of
  www.logius.nl, logius.nl and mailing.logius.nl found no MCP documentation. This is a
  CANDIDATE tool list derived from the operationIds in the three Logius Standaarden
  OpenAPI contracts saved in this repo. These contracts are interface standards that
  implementers host themselves (no base URL), so any server built from them would point
  at an implementer's deployment, not at a Logius-hosted endpoint.
deployment:
  mode: none
  auth: unknown
  verified: searched
