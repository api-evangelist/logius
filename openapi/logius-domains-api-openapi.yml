components:
  schemas:
    FieldValidationError:
      required:
      - name
      - code
      - reason
      type: object
      properties:
        name:
          title: Name
          description: Naam van het veld met ongeldige gegevens
          type: string
          minLength: 1
        code:
          title: Code
          description: Systeemcode die het type Error aangeeft
          type: string
          minLength: 1
        reason:
          title: Reason
          description: Uitleg wat er precies Error is met de gegevens
          type: string
          minLength: 1
    ValidationError:
      required:
      - code
      - title
      - status
      - detail
      - instance
      - invalidParams
      type: object
      properties:
        type:
          title: Type
          description: URI referentie naar het type Error, bedoeld voor developers
          type: string
        code:
          title: Code
          description: Systeemcode die het type Error aangeeft
          type: string
          minLength: 1
        title:
          title: Title
          description: Generieke titel voor het type Error
          type: string
          minLength: 1
        status:
          title: Status
          description: De HTTP status code
          type: integer
        detail:
          title: Detail
          description: Extra informatie bij de Error, indien beschikbaar
          type: string
          minLength: 1
        instance:
          title: Instance
          description: URI met referentie naar dit specifiek voorkomen van de Error. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          type: string
          minLength: 1
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
    Error:
      required:
      - code
      - title
      - status
      - detail
      - instance
      type: object
      properties:
        type:
          title: Type
          description: URI referentie naar het type Error, bedoeld voor developers
          type: string
        code:
          title: Code
          description: Systeemcode die het type Error aangeeft
          type: string
          minLength: 1
        title:
          title: Title
          description: Generieke titel voor het type Error
          type: string
          minLength: 1
        status:
          title: Status
          description: De HTTP status code
          type: integer
        detail:
          title: Detail
          description: Extra informatie bij de Error, indien beschikbaar
          type: string
          minLength: 1
        instance:
          title: Instance
          description: URI met referentie naar dit specifiek voorkomen van de Error. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          type: string
          minLength: 1
    Domain:
      required:
      - name
      type: object
      properties:
        url:
          title: URL
          description: URL reference to this resource. This link is generated automatically.
          type: string
          format: uri
          maxLength: 2042
          minLength: 1
          readOnly: true
          example: https://example.com
        uuid:
          title: uuid
          description: Identifier for the domain.
          type: string
          format: uuid
          readOnly: true
          example: 7a22eb38-bca6-463f-9955-54ab040287cb
        name:
          title: name
          description: Name of the domain.
          type: string
          minLength: 1
          example: nl.vng.zgw.zaken
        documentationLink:
          title: documentationLink
          description: Link to human readable information about the domain and its notifications
          type:
          - string
          - 'null'
          format: url
          minLength: 1
          example: https://www.vngrealisatie.nl/ZaakSysteem/Notificaties.html
        filterAttributes:
          title: filterAttributes
          description: Filter attributes offered by the domain.
          type: array
          items:
            type: string
            minLength: 1
  securitySchemes:
    JWT-Claims:
      bearerFormat: JWT
      scheme: bearer
      type: http
