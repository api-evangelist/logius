      operationId: domains_list
      summary: List domains
      description: Returns a list with information about all domains.
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Name of the domain.
      responses:
        '200':
          description: OK
          headers:
            API-version:
              schema:
                type: string
              description: 'Version of the API. For example: 1.2.1.'
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    format: uri
                  previous:
                    type: string
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
        '400':
          description: Bad request
          headers:
            API-version:
              schema:
                type: string
              description: 'Version of the API. For example: 1.2.1.'
          content:
            application/problem+json:
